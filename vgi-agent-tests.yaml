# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (crates/mask-worker/src/lib.rs); the answers live here, keyed by task name,
# so the agent being graded never sees them. vgi-lint discovers this file in
# the directory it runs from.
# Every reference query is deterministic: the redaction outputs are exact
# strings, the FPE round-trip recovers its own input, and the FPE/token outputs
# depend only on the fixed key k.

tasks:
  - name: "redact_card_last4"
    reference_sql: "SELECT mask.main.mask_redact('4012888888881881', 'last4')"
    ignore_column_names: true
  - name: "redact_email_for_display"
    reference_sql: "SELECT mask.main.mask_redact('alice@example.com', 'email')"
    ignore_column_names: true
  - name: "fpe_roundtrip_ssn"
    reference_sql: "SELECT mask.main.mask_unfpe(mask.main.mask_fpe('123-45-6789', 'ssn', 'k'), 'ssn', 'k')"
    ignore_column_names: true
  - name: "token_pseudonym"
    reference_sql: "SELECT mask.main.mask_token('customer-42', 'k')"
    ignore_column_names: true
  - name: "fpe_card"
    reference_sql: "SELECT mask.main.mask_fpe('4012888888881881', 'card', 'k')"
    ignore_column_names: true
